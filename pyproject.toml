[project]
name = "decision-model-bench"
version = "0.1.0"
description = "Speed and JevBench accuracy of small typed decision models"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Gemma 4 support and the mlx extra are on main, not yet on PyPI. The extra installs MLX
    # only on Apple-silicon macOS.
    "strands-decider[mlx] @ git+https://github.com/strands-labs/strands-decider",
    "httpx>=0.27",
]

[tool.uv]
package = false
